<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="birdShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="24" fill="#FFFFFF" />

  <!-- Iconic 5-Feather Bird of Wonderful Indonesia -->
  <g transform="translate(400, 150)" filter="url(#birdShadow)">
    <!-- Feather 1 (Teal Green - #00A651) -->
    <path d="M -110,-45 C -130,-15 -115,25 -80,45 C -55,60 -25,65 -5,55 C -45,45 -85,15 -90,-25 Z" fill="#00A651" />
    
    <!-- Feather 2 (Sky Blue - #009FE3) -->
    <path d="M -70,-75 C -90,-40 -80,5 -50,30 C -25,50 15,55 35,40 C 0,35 -40,10 -50,-50 Z" fill="#009FE3" />
    
    <!-- Feather 3 (Magenta / Purple - #9B2689) -->
    <path d="M 0,-95 C -15,-60 -5,-10 20,20 C 45,45 80,45 100,25 C 65,25 25,-5 20,-70 Z" fill="#9B2689" />
    
    <!-- Feather 4 (Orange - #F37023) -->
    <path d="M 70,-75 C 55,-40 60,-5 85,20 C 105,40 145,40 160,15 C 130,20 95,-5 85,-55 Z" fill="#F37023" />
    
    <!-- Feather 5 (Yellow - #FFD100) -->
    <path d="M 125,-40 C 115,-15 118,15 140,35 C 158,50 190,45 205,25 C 175,30 148,15 140,-25 Z" fill="#FFD100" />
  </g>

  <!-- Typography: wonderful indonesia / pesona indonesia -->
  <text x="400" y="275" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5" fill="#1E293B">
    wonderful indonesia
  </text>
  
  <text x="400" y="320" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="4" fill="#0284C7">
    PESONA INDONESIA
  </text>

  <rect x="280" y="345" width="240" height="2.5" rx="1" fill="#E2E8F0" />

  <text x="400" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="5" fill="#64748B">
    KEMENTERIAN PARIWISATA DAN EKONOMI KREATIF RI
  </text>

  <text x="400" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="12" letter-spacing="2" fill="#94A3B8">
    OFFICIAL LOGO & BRAND ASSETS
  </text>
</svg>
