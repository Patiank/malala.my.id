            <p style="font-size: 1.1rem; color: #475569;">Portal resmi direktori pariwisata Sumatera Barat, panduan pariwisata Sumbar, dan ensiklopedia digital kebudayaan Minangkabau di Ranah Minang, Indonesia.</p>

          <section style="margin-bottom: 2rem;">
            <h2 style="color: #b45309; font-size: 1.5rem;">Ringkasan Informasi Wisata & Budaya</h2>
            <p>MALALA menghadirkan direktori pariwisata Sumatera Barat terlengkap dengan <strong>38 Destinasi Wisata Pilihan</strong>, <strong>22 Warisan Adat & Seni Budaya Minangkabau</strong>, <strong>26 Kuliner Otentik Legendaris</strong>, serta <strong>20 Kalender Festival Karisma Event Nusantara (KEN) 2026</strong> yang dilengkapi fitur asisten AI pintar Uni Mala dan unduhan buku panduan resmi.</p>
          </section>

          <section style="margin-bottom: 2rem;">
            <h2 style="color: #0f766e; font-size: 1.35rem;">Destinasi Wisata Unggulan Sumatera Barat:</h2>
            <ul>
              <li><strong>Jam Gadang & Ngarai Sianok</strong> (Kota Bukittinggi) — Ikon arsitektur bersejarah dengan menara jam antik dan ngarai patahan tektonik megah.</li>
              <li><strong>Geopark Lembah Harau</strong> (Kabupaten Lima Puluh Kota) — Lembah tebing granit vertikal setinggi ratusan meter dengan air terjun alami.</li>
              <li><strong>Danau Singkarak & Danau Maninjau</strong> — Danau vulkanik dan tektonik luas dengan panorama Kelok 44 dan ikan bilih endemik.</li>
              <li><strong>Istano Basa Pagaruyung</strong> (Kabupaten Tanah Datar) — Istana megah kebesaran Kerajaan Minangkabau dengan ukiran bergonjong 11.</li>
              <li><strong>Kawasan Wisata Bahari Mandeh</strong> (Kabupaten Pesisir Selatan) — Gugusan pulau tropis, terumbu karang dangkal, dan teluk eksotis.</li>
              <li><strong>Kepulauan Mentawai</strong> — Destinasi kepulauan tropis dengan ombak selancar terbaik dunia dan suku asli Uma Mentawai.</li>
              <li><strong>Warisan Dunia UNESCO Sawahlunto</strong> — Kota tambang batubara Ombilin dengan terowongan Lubang Mbah Soero dan lokomotif Mak Itam.</li>
              <li><strong>Candi Padang Roco & Percandian Dharmasraya</strong> — Situs purbakala percandian Buddha Kerajaan Dharmasraya abad ke-13 tujuan Ekspedisi Pamalayu.</li>
              <li><strong>Puncak Lawang, Danau Kembar, Air Terjun Nyarai, Geopark Silokek, Seribu Rumah Gadang Solok Selatan</strong>, dan puluhan destinasi lainnya.</li>
            </ul>
          </section>

          </section>
