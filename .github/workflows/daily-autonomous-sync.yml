name: Malala Autonomous Daily AI Sync

on:
  schedule:
    # Runs daily at 17:00 UTC (00:00 WIB midnight)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  autonomous_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Autonomous Daily AI Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AQ.Ab8RN6L6YdQ1D5yiwawCr73Xqsd3nr9gLQ1AAG0xsKRfe8W9Uw' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'AQ.Ab8RN6L6YdQ1D5yiwawCr73Xqsd3nr9gLQ1AAG0xsKRfe8W9Uw' }}
        run: node scripts/autonomous-daily-sync.mjs
